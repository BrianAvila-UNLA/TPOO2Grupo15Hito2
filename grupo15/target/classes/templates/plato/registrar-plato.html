<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Plato | Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">EG</span>
            <span>Epicentro Gourmet</span>
        </a>
        <nav class="main-nav" aria-label="Navegación principal">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/unidades/registrar}">Registrar una unidad de venta</a>
            <a th:href="@{/usuarios/login}">Iniciar sesión</a>
        </nav>
    </div>
</header>

<main class="container form-page">
    <p class="eyebrow">Menú</p>
    <h1>Registrar Nuevo Plato</h1>
    <p class="form-intro">
        Agregá un nuevo plato al menú de tu unidad de venta.
    </p>

    <form class="registration-form" th:action="@{/platos/guardar}" th:object="${plato}" method="post">
        <label for="nombrePlato">Nombre del plato</label>
        <input id="nombrePlato" type="text" th:field="*{nombrePlato}" required>

        <label for="precioVenta">Precio de venta ($)</label>
        <input id="precioVenta" type="number" step="0.01" min="0" th:field="*{precioVenta}" required>

        <label for="costoProduccion">Costo de producción ($)</label>
        <input id="costoProduccion" type="number" step="0.01" min="0" th:field="*{costoProduccion}" required>

        <button class="button button-secondary" type="submit">Guardar Plato</button>
    </form>
</main>
</body>
</html>
