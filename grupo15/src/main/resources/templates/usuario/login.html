<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">EG</span>
            <span>Epicentro Gourmet</span>
        </a>
        <nav class="main-nav" aria-label="Navegación principal">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/unidades/registrar}">Registrar una unidad de venta</a>
        </nav>
    </div>
</header>

<main class="container form-page">
    <p class="eyebrow">Acceso</p>
    <h1>Iniciar sesión</h1>
    <p class="form-intro">Usá el correo registrado y la contraseña recibida por email.</p>

    <div class="error-message" th:if="${param.error}">
        El correo o la contraseña son incorrectos.
    </div>
    <div class="success-message" th:if="${param.logout}">
        Cerraste la sesión correctamente.
    </div>

    <form class="registration-form" th:action="@{/login}" method="post">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="contrasenia">Contraseña</label>
        <input id="contrasenia" name="contrasenia" type="password" autocomplete="current-password" required>

        <button class="button button-secondary" type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
