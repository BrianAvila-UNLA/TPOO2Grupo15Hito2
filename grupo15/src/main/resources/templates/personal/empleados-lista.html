<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Empleados | Epicentro Gourmet</title>
    <link rel="icon" type="image/jpeg" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="encabezado-sitio">
        <div class="contenedor navegacion">
            <a class="marca" th:href="@{/responsable}">
                <span class="marca-icono">EG</span>
                <span>Epicentro Gourmet</span>
            </a>
            <nav class="navegacion-principal" aria-label="Navegación principal">
                <a th:href="@{/responsable}" class="boton">Volver</a>
                <span class="sesion-usuario">
                    <span class="nombre-sesion-usuario" th:text="${'Hola: ' + usuario.nombre}">Hola</span>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit">Cerrar sesión</button>
                    </form>
                </span>
            </nav>
        </div>
    </header>

    <main class="contenedor seccion-contenido pagina-compacta" style="background-color: #fbf8fc; border-radius: 8px;">
        <div class="encabezado-seccion">
            <div>
                <p class="subtitulo">Panel de Responsable</p>
                <h2>Gestión de Empleados</h2>
            </div>
        </div>

        <div style="margin-bottom: 2rem; display: flex; gap: 10px;">
            <a th:href="@{/responsable/empleados/cajero/nuevo}" class="boton boton-principal"
                style="text-decoration: none;">Registrar Nuevo Cajero</a>
            <a th:href="@{/responsable/empleados/cocinero/nuevo}" class="boton boton-principal"
                style="text-decoration: none;">Registrar Nuevo Cocinero</a>
        </div>

        <h3 style="margin-bottom: 1rem;">Personal Asignado</h3>

        <div class="rejilla-festivales" th:if="${not #sets.isEmpty(empleados)}">
            <article class="tarjeta-festival" th:each="emp : ${empleados}">
                <div class="acento-tarjeta"></div>
                <div class="contenido-tarjeta">
                    <h4 th:text="${emp.nombre + ' ' + emp.apellido}">Nombre Empleado</h4>
                    <div style="margin-top: 0.8rem; font-size: 0.95rem; color: #5f5269;">
                        <span>Email: </span><strong th:text="${emp.email}">email@mail.com</strong><br>
                        <span>DNI: </span><strong th:text="${emp.dni}">00000000</strong><br>
                        <span>Rol: </span>
                        <strong
                            th:text="${emp instanceof T(com.unla.grupo15.entities.Cocinero) ? 'Cocinero' : 'Cajero'}">Rol</strong><br>
                        <span>Estado: </span><strong
                            th:text="${emp.credenciales != null and emp.credenciales.activo ? 'Activo' : 'Inactivo'}">Activo</strong>
                    </div>
                    <div style="margin-top: 1rem;">
                        <a th:href="@{/responsable/empleados/{id}/editar(id=${emp.idPersonal})}" class="boton"
                            style="background-color: #5b2a86; color: white; padding: 6px 12px; font-size: 0.85rem; text-decoration: none; display: inline-block;">
                            Modificar
                        </a>

                        <form th:if="${emp.credenciales != null and emp.credenciales.activo}"
                            th:action="@{/responsable/empleados/baja/{id}(id=${emp.idPersonal})}" method="post"
                            style="display: inline;"
                            onsubmit="return confirm('¿Está seguro de dar de baja este empleado?');">
                            <button type="submit" class="boton"
                                style="background-color: #f05555; color: white; padding: 6px 12px; font-size: 0.85rem;">
                                Dar de Baja
                            </button>
                        </form>

                        <form th:if="${emp.credenciales != null and emp.credenciales.activo}"
                            th:action="@{/responsable/empleados/inactivar/{id}(id=${emp.idPersonal})}" method="post"
                            style="display: inline;"
                            onsubmit="return confirm('¿Está seguro de inactivar este empleado?');">
                            <button type="submit" class="boton"
                                style="background-color: #766f82; color: white; padding: 6px 12px; font-size: 0.85rem;">
                                Inactivar empleado
                            </button>
                        </form>


                        <a th:unless="${emp.credenciales != null and emp.credenciales.activo}"
                            th:href="@{/responsable/empleados/activar/{id}(id=${emp.idPersonal})}" class="boton"
                            style="background-color: #35d13d; color: white; padding: 6px 12px; font-size: 0.85rem; text-decoration: none; display: inline-block;">
                            Activar
                        </a>
                    </div>
                </div>
            </article>
        </div>

        <p th:if="${#sets.isEmpty(empleados)}" style="color: #766f82; font-style: italic;">
            No hay empleados registrados en esta unidad de venta.
        </p>
    </main>
</body>

</html>
