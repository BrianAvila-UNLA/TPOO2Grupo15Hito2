<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Epicentro Gourmet - Cierre de Caja</title>
    <link rel="icon" type="image/jpeg" th:href="@{/favicon.ico}">
    <style>
        body { font-family: Arial, sans-serif; background: url("../images/background_home.jpg") center / cover fixed; margin: 0; padding: 20px; }
        .contenedor { max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.88); padding: 30px; border: 1px solid rgba(255,255,255,0.7); border-radius: 18px; box-shadow: 0 18px 45px rgba(38,35,33,0.18); backdrop-filter: blur(5px); }
        h2 { color: #5b2a86; margin-top: 0; }
        .stats { background: #f7eafa; padding: 15px; border-radius: 6px; margin: 20px 0; }
        .stats p { font-size: 18px; margin: 10px 0; color: #333; }
        .btn-back { display: inline-block; background-color: #5b2a86; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-back:hover { background-color: #d94f91; }
    </style>
</head>
<body>

<div class="contenedor">
    <div style="text-align: right; margin-bottom: 1rem;">
        <a th:href="@{/empleado/inicio}" class="btn-back">Volver</a>
    </div>
    <p th:if="${personal != null}" th:text="${'Hola: ' + personal.nombre + ' ' + personal.apellido}">Hola</p>
    <h2>Resumen de Cierre de Caja</h2>
    <p th:if="${yaCerrada}" style="color: #9c356f;">
        Esta caja ya fue cerrada para la fecha seleccionada. Se muestra el cierre registrado previamente.
    </p>
    <p>Unidad de Venta: <strong th:text="${cierreCaja.unidadVenta.nombreComercial}">Local</strong></p>
    <p>Fecha: <strong th:text="${#temporals.format(cierreCaja.fecha, 'dd/MM/yyyy')}"></strong></p>
    <p>Cajero: <strong th:text="${cierreCaja.cajero.nombre + ' ' + cierreCaja.cajero.apellido}"></strong></p>

    <div class="stats">
        <p>Total de Pedidos del Día: <strong th:text="${cierreCaja.totalPedidos}">0</strong></p>
        <p>Recaudación del Día: $<strong th:text="${cierreCaja.recaudacionTotal}">0.00</strong></p>
        <p>Cierre registrado: <strong th:text="${#temporals.format(cierreCaja.fechaHoraCierre, 'dd/MM/yyyy HH:mm:ss')}"></strong></p>
    </div>

    <a th:href="@{/empleado/inicio}" class="btn-back">← Volver al Panel de Empleado</a>
</div>

</body>
</html>
